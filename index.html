<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Trening za decu</title>
<meta name="description" content="Trening sa sopstvenom težinom za decu: vežbe unutra ili napolju, tajmer za odmor i nedeljni ciljevi.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trening">
<script>
  // No zooming, like a real app (same fix as the Gitara app). iOS Safari ignores user-scalable=no, so:
  // 1) block its pinch gestures, 2) cancel any touch move with two or more fingers. One-finger scrolling is never cancelled.
  (function () {
    var stop = function (ev) { ev.preventDefault(); };
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (e) { document.addEventListener(e, stop, { passive: false }); });
    document.addEventListener('touchmove', function (ev) {
      if (ev.touches.length > 1 || (ev.scale !== undefined && ev.scale !== 1)) ev.preventDefault();
    }, { passive: false });
    // no long-press / right-click menus, except in fields where you type
    document.addEventListener('contextmenu', function (ev) {
      if (!(ev.target.closest && ev.target.closest('input, textarea'))) ev.preventDefault();
    });
    // Android/Chrome "install" offer, kept for the Instaliraj button in Podešavanja
    window.addEventListener('beforeinstallprompt', function (ev) { ev.preventDefault(); window.__installPrompt = ev; });
    window.addEventListener('appinstalled', function () { window.__installPrompt = null; });
  })();
</script>
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Inter (variable, all weights in one file), self-hosted. Licence: fonts/OFL.txt */
@font-face{font-family:Inter;font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/inter-latin-ext-wght-normal.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:Inter;font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/inter-latin-wght-normal.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bg:#F5F5F7; --s1:#FFFFFF; --s2:#E8E8ED; --line:#DCDCE1; --ink:#0B0B0D; --mut:#6E6E73; --dim:#B4B4BA;
  --neon:#1FD873; --neon-ink:#00140A; --neon-txt:#0E9F50; --neon-d:#CFEFDC; --red:#E5372B; --warn:#FFF4D6; --warn-ink:#6B4E00; --glow:none;
  --ill-near:#0B0B0D; --ill-far:#6E6E73; --ill-prop:#8E8E93; --ill-floor:#A1A1A6; --ill-accent:#0A8A45;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --s1:#0C0C0E; --s2:#16161A; --line:#1E1E22; --ink:#F5F5F7; --mut:#8A8A90; --dim:#3C3C42;
    --neon:#3DFF8F; --neon-ink:#000000; --neon-txt:#3DFF8F; --neon-d:#123A24; --red:#FF5B4F; --warn:#1F1A0A; --warn-ink:#FFD66B;
    --glow:drop-shadow(0 0 10px rgba(61,255,143,.5)) drop-shadow(0 0 2px rgba(61,255,143,.9));
    --ill-near:#F5F5F7; --ill-far:#A3A3AB; --ill-prop:#8E8E96; --ill-floor:#76767E; --ill-accent:#3DFF8F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --s1:#0C0C0E; --s2:#16161A; --line:#1E1E22; --ink:#F5F5F7; --mut:#8A8A90; --dim:#3C3C42;
  --neon:#3DFF8F; --neon-ink:#000000; --neon-txt:#3DFF8F; --neon-d:#123A24; --red:#FF5B4F; --warn:#1F1A0A; --warn-ink:#FFD66B;
  --glow:drop-shadow(0 0 10px rgba(61,255,143,.5)) drop-shadow(0 0 2px rgba(61,255,143,.9));
  --ill-near:#F5F5F7; --ill-far:#A3A3AB; --ill-prop:#8E8E96; --ill-floor:#76767E; --ill-accent:#3DFF8F;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
/* no zooming (neither pinch nor double-tap); scrolling and taps work normally */
html,body{touch-action:pan-x pan-y}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 17px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:pan-x pan-y}
:focus-visible{outline:2px solid var(--neon);outline-offset:3px;border-radius:6px}
#app{max-width:560px;margin:0 auto;padding-bottom:200px}
body.focusing #app{padding-bottom:0}
.pad{padding:28px 24px 0}
.pad2{padding:18px 24px 0}
.eyebrow{font-size:14px;color:var(--mut);font-weight:500}
h1{font-size:36px;line-height:1.1;font-weight:700;letter-spacing:-.03em;margin:4px 0 0}
h2{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:0}
.lead{margin:20px 24px 0;color:var(--mut);font-size:16px;max-width:36ch}
.link{font-size:15px;font-weight:500;color:var(--mut);min-height:44px;display:inline-flex;align-items:center}
.link:active{color:var(--ink)}
.danger{color:var(--red)}
.safety{display:flex;gap:12px;align-items:flex-start;margin:22px 24px 0;padding:14px 16px;border-radius:18px;background:var(--warn);color:var(--warn-ink);font-size:15.5px;font-weight:500;line-height:1.4}
.safety svg{flex:none;width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:-1px}

/* hero ring */
.hero{position:relative;width:220px;height:220px;margin:18px auto 0}
.hero svg{width:100%;height:100%;overflow:visible}
.seg{fill:none;stroke:var(--neon-d);stroke-width:14;stroke-linecap:round}
.seg.on{stroke:var(--neon);filter:var(--glow)}
.hero-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero-n{font-size:64px;font-weight:200;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.hero-n span{color:var(--dim)}
.hero-l{font-size:14px;color:var(--mut);margin-top:6px}
.month{display:flex;align-items:center;gap:12px;margin:18px 24px 0;font-size:14px;color:var(--mut)}
.mbar{flex:1;height:4px;background:var(--s2);border-radius:2px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--ink);border-radius:2px;transition:width .4s}
.mbar i.met{background:var(--neon)}
.month b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* lists */
.list{margin:24px 24px 0}
.sec{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--mut);margin-bottom:2px}
.sec{flex-wrap:wrap;row-gap:0}
.sec .lnks{display:flex;gap:18px;white-space:nowrap}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.row .n{width:18px;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.thumb{flex:none;width:68px;height:51px;display:block}
.thumb svg{display:block;width:100%;height:100%}
.row .nm{flex:1;min-width:0;font-size:16.5px;font-weight:600;line-height:1.3}
.row .nm small{display:block;font-size:13.5px;color:var(--mut);font-weight:400;margin-top:2px}
.row .m{display:flex;align-items:center;gap:12px;font-size:14.5px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .m b{color:var(--ink);font-weight:500}
.row .m b.dim{color:var(--mut);font-weight:400}
.row.done .nm{color:var(--mut)}
.row .ok svg{width:22px;height:22px;stroke:var(--neon-txt);display:block}
.row .part{color:var(--neon-txt);font-weight:600}
.row.static{cursor:default}
.list-foot{display:flex;flex-wrap:wrap;gap:4px 24px;padding:10px 0 0}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:9px;background:var(--s2);color:var(--mut);margin-left:6px;vertical-align:1px}
.tag.j{background:var(--neon-d);color:var(--neon-txt)}

/* dock + buttons */
.dock{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));padding:28px 24px 14px;background:linear-gradient(to bottom,transparent,var(--bg) 40%);z-index:15;max-width:560px;margin:0 auto}
.cta{display:flex;align-items:center;justify-content:center;width:100%;min-height:64px;border-radius:32px;background:var(--neon);color:var(--neon-ink);font-weight:700;font-size:19px;letter-spacing:-.01em;padding:0 20px}
.cta:active{transform:scale(.98)}
.cta.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.cta.wide{margin-top:18px}
.iconbtn{width:48px;height:48px;display:grid;place-items:center;border-radius:24px;color:var(--mut)}
.iconbtn svg{width:22px;height:22px;stroke:currentColor}

/* place picker */
.places{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.place{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:190px;padding:20px 12px;border-radius:26px;border:2px solid var(--line);background:var(--s1);text-align:center}
.place:active{transform:scale(.98)}
.place.on{border-color:var(--neon)}
.place svg{width:64px;height:64px;stroke:var(--neon-txt);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.place b{font-size:24px;font-weight:700;letter-spacing:-.02em}
.place small{font-size:14px;color:var(--mut);line-height:1.35}

/* focus mode */
.focus{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.ftop{display:flex;align-items:center;gap:12px;padding:12px 16px 0 10px}
.segs{flex:1;display:flex;gap:4px}
.sg{flex:1;height:30px;position:relative}
.sg::after{content:"";position:absolute;left:0;right:0;top:13px;height:4px;border-radius:2px;background:var(--s2)}
.sg.d::after{background:var(--neon)}
.sg.c::after{background:var(--ink)}
.cnt{font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.fmain{flex:1;display:flex;flex-direction:column}
/* exercise pictures sit straight on the page background (no card); colours follow the theme */
.fpic{margin:14px 24px 0}
.fpic .ill{display:block}
.fpic svg{display:block;width:100%;height:auto;aspect-ratio:4/3;max-height:36vh;max-height:36dvh}
.fside{flex:1;display:flex;flex-direction:column}
.fbody{flex:1;padding:18px 24px 0}
.grp{font-size:14px;color:var(--mut)}
.fname{display:flex;align-items:center;gap:10px;text-align:left;font-size:31px;line-height:1.12;font-weight:700;letter-spacing:-.03em;margin:4px 0 0;min-height:48px}
.fname svg{flex:none;width:24px;height:24px;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round}
.fname[aria-expanded="true"] svg{stroke:var(--neon-txt)}
.how{margin:10px 0 0;font-size:17px;line-height:1.5;color:var(--ink);background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.hint{font-size:13.5px;color:var(--mut);margin-top:2px}
.num{margin:22px 0 0;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.num .val{flex:1;min-width:140px}
.big{width:100%;border:0;background:transparent;padding:0;font-size:84px;font-weight:200;letter-spacing:-.06em;line-height:1;font-variant-numeric:tabular-nums;caret-color:var(--neon)}
.big::placeholder{color:var(--dim)}
.u{font-size:15px;color:var(--mut);margin-top:2px}
.step{display:flex;gap:12px}
.step button{min-width:68px;height:68px;padding:0 14px;border-radius:34px;border:1.5px solid var(--line);font-size:22px;font-weight:500;display:grid;place-items:center}
.step button:active{background:var(--s2)}
.sets{display:flex;flex-wrap:wrap;gap:14px;margin:26px 0 0}
.sw{position:relative}
.set{width:58px;height:58px;border-radius:29px;border:2px solid var(--neon-txt);color:var(--neon-txt);font-size:17px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.set svg{width:26px;height:26px;stroke:currentColor}
.set.done{background:var(--neon);border-color:var(--neon);color:var(--neon-ink)}
.set.cur{outline:2.5px solid var(--ink);outline-offset:3px}
.set.add{border:2px dashed var(--dim);color:var(--mut);font-size:24px;font-weight:300}
.setx{position:absolute;top:-9px;right:-9px;width:28px;height:28px;border-radius:14px;background:var(--bg);border:1.5px solid var(--red);color:var(--red);display:grid;place-items:center}
.setx svg{width:14px;height:14px;stroke:currentColor}
.last{margin-top:20px;font-size:14.5px;color:var(--mut);line-height:1.5}
.last b{color:var(--ink);font-weight:500}
.last .up{color:var(--neon-txt);font-weight:600}
.tools{display:flex;gap:4px 24px;margin:14px 0 0;flex-wrap:wrap}
.fdock{position:sticky;bottom:0;padding:18px 24px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 14px)}
.rest{border:1px solid var(--line);background:var(--s1);border-radius:26px;padding:14px 20px 8px}
.rest-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.rest-l{font-size:15px;color:var(--mut);font-weight:600}
.rest-t{font-size:46px;font-weight:200;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.rest-line{height:4px;border-radius:2px;background:var(--s2);margin:12px 0 4px;overflow:hidden}
.rest-line i{display:block;height:100%;background:var(--neon);transform-origin:left;filter:var(--glow)}
.rest-b{display:flex;align-items:center;gap:22px}
.rest-b .sp{flex:1}
.mute{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mute svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cta.go{animation:go 1.2s ease-in-out infinite}
@keyframes go{50%{box-shadow:0 0 38px rgba(61,255,143,.65);transform:scale(1.015)}}
@media (prefers-reduced-motion:reduce){.cta.go{animation:none}}
.next{display:flex;justify-content:space-between;gap:16px;font-size:14px;color:var(--mut);margin-bottom:12px}
.next b{color:var(--ink);font-weight:500;text-align:right}

/* exercises */
.search{width:100%;height:52px;border-radius:26px;border:1px solid var(--line);background:var(--s1);padding:0 20px}
.search::placeholder{color:var(--mut)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -24px 0;padding:0 24px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;margin:12px 0 0;padding:0}
.chip{white-space:nowrap;height:42px;padding:0 16px;border-radius:21px;border:1px solid var(--line);font-size:14.5px;font-weight:500;color:var(--mut)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.flabel{font-size:14px;color:var(--mut);margin:18px 0 0}

/* history */
.stats{display:flex;gap:30px;margin:28px 24px 0;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:54px;font-weight:200;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:14px;color:var(--mut);margin-top:6px}
.stats .n b{color:var(--neon-txt)}
.stats.sm{margin:20px 0 0;gap:26px}
.stats.sm b{font-size:40px}
.weeks{display:flex;gap:6px;margin:28px 24px 0;height:48px;align-items:flex-end}
.wk{flex:1;display:flex;flex-direction:column-reverse;gap:3px}
.wk i{height:12px;border-radius:3px;background:var(--s2)}
.wk i.on{background:var(--neon)}
.wl{display:flex;justify-content:space-between;margin:8px 24px 0;font-size:12px;color:var(--mut)}
.sess{border-bottom:1px solid var(--line)}
.sess summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:64px;padding:12px 0;cursor:pointer}
.sess summary::-webkit-details-marker{display:none}
.sess summary b{display:block;font-size:17px;font-weight:600}
.sess summary small{display:block;font-size:14px;color:var(--mut);margin-top:2px}
.sess .m{font-size:14px;color:var(--mut)}
.sess ul{list-style:none;margin:0;padding:0 0 8px}
.sess li{display:flex;justify-content:space-between;gap:14px;padding:6px 0;font-size:15px}
.sess li span:last-child{color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.sess .link{margin:0 0 8px}
.settings{margin:36px 24px 0;padding-top:20px;border-top:1px solid var(--line)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:16px;font-size:16px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:52px;height:52px;border-radius:26px;border:1px solid var(--line);font-size:22px;font-weight:300}
.stepper output{font-size:24px;font-weight:300;min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.fine{font-size:13.5px;color:var(--mut);margin:16px 0 0}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
body.focusing .nav{display:none}
.nav>div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{padding:12px 0 10px;min-height:64px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:500;color:var(--mut)}
.nav svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.nav i{width:5px;height:5px;border-radius:50%}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] i{background:var(--neon);box-shadow:0 0 8px var(--neon)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0 / .6);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:90vh;max-height:90dvh;border-radius:26px 26px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:16px 14px 4px 24px}
.sheet-h h2{flex:1}
.sheet-b{overflow-y:auto;padding:0 24px 28px}
.sheet-b .list{margin:14px 0 0}
.sheet-b .fpic{margin:10px 0 0}
.sheet-b .fpic svg{max-height:40vh}
.sheet-b .how{background:none;border:0;padding:0;color:var(--mut)}
.chart{margin-top:20px}
.chart svg{display:block;width:100%;height:auto}
.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:22px;font-weight:600;font-size:15px;z-index:40;max-width:calc(100vw - 32px);text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .cta:not(.ghost){box-shadow:0 0 28px rgba(61,255,143,.3)}
  :root:not([data-theme="light"]) .set.done{box-shadow:0 0 14px rgba(61,255,143,.4)}
  :root:not([data-theme="light"]) .stats .n b{text-shadow:0 0 18px rgba(61,255,143,.45)}
}
:root[data-theme="dark"] .cta:not(.ghost){box-shadow:0 0 28px rgba(61,255,143,.3)}

function startMoving(){
  requestAnimationFrame(()=>document.querySelectorAll('[data-ill*="/anim/"] > svg:not([data-run])').forEach(sv=>{
    const fresh = sv.cloneNode(true); fresh.setAttribute("data-run", ""); sv.replaceWith(fresh);
  }));
}
function illHTML(slug, alt, animate, cls){
  const path = `images/${animate ? "anim/" : ""}${slug}.svg`;
  if(!ILL.has(path)) loadIll(path);
  const label = alt ? `role="img" aria-label="${esc(alt)}"` : `aria-hidden="true"`;
  return `<span class="${cls}" data-ill="${path}" ${label}>${ILL.get(path) || ""}</span>`;
}
function picHTML(slug, alt, animate){ return illHTML(slug, alt, animate && !reduceMotion.matches, "ill"); }
const picOf = (e, animate) => picHTML(slugOf(e), e ? e.name : "", animate);
const thumbOf = e => illHTML(slugOf(e), "", false, "thumb");
const isTimed = e => !!e && e.type === "sec";
const allowed = (e, place) => place === "out" || e.place === "in";
function sortedSessions(){ return S.sessions.slice().sort((a,b)=>a.date.localeCompare(b.date)); }
function sessionTitle(s){ return "Trening " + (sortedSessions().findIndex(x=>x.id===s.id) + 1); }
function historyFor(exId){
  const out = [];
  sortedSessions().forEach((s,i)=>s.items.forEach(it=>{ if(it.ex===exId) out.push({s,i,it}); }));
  return out;
}
const maxV = it => Math.max(0, ...it.sets.map(x=>+x.v||0));
function clampV(e, v){
  v = Math.round(+v || 0);
  return isTimed(e) ? Math.max(MIN_SEC, Math.min(MAX_SEC, v || e.amount || 20)) : Math.max(1, Math.min(MAX_REPS, v || e.amount || 10));
}

/* ---------- Serbian words ---------- */
function pl(n, forms){ n = Math.abs(+n||0); const a = n%10, b = n%100;
  if(a===1 && b!==11) return forms[0]; if(a>=2 && a<=4 && (b<12 || b>14)) return forms[1]; return forms[2]; }
const W = {
  ponavljanje:["ponavljanje","ponavljanja","ponavljanja"], sekunda:["sekunda","sekunde","sekundi"],
  dodir:["dodir","dodira","dodira"], put:["put","puta","puta"], vezba:["vežba","vežbe","vežbi"],
  trening:["trening","treninga","treninga"], serija:["serija","serije","serija"], nedelja:["nedelja","nedelje","nedelja"]
};
function unitWord(e, v){ return pl(v, isTimed(e) ? W.sekunda : (W[e.unit] || W.ponavljanje)); }
function amountText(e, v){ return isTimed(e) ? `${v} s` : `${v}${e.unit ? " " + pl(v, W[e.unit]) : ""}`; }
function amountLong(e, v){ return `${v} ${unitWord(e, v)}${e.side ? " " + e.side : ""}`; }
function setSummary(it){
  const e = exById(it.ex) || {type:"reps"}; const vs = it.sets.map(x=>+x.v||0);
  const same = vs.every(v=>v===vs[0]);
  const body = same ? `${vs.length} × ${amountText(e, vs[0])}` : vs.map(v=>amountText(e, v)).join(", ");
  return body + (e.side ? " " + e.side : "");
}

/* ---------- suggestions ---------- */
function suggestion(exId){
  const e = exById(exId) || {type:"reps", amount:10};
  const h = historyFor(exId);
  if(!h.length) return {sets:3, v:clampV(e, e.amount), last:null, up:false};
  const last = h[h.length-1].it, prev = h.length>1 ? h[h.length-2].it : null;
  const lv = maxV(last), pv = prev ? maxV(prev) : null;
  let v = clampV(e, lv), up = false;
  if(prev && pv===lv && last.sets.length>=3){
    const nv = clampV(e, lv + (isTimed(e) ? 5 : 1));
    if(nv > v){ v = nv; up = true; }
  }
  return {sets:Math.max(3, last.sets.length), v, last, up};
}
const capOf = e => isTimed(e) ? MAX_SEC : MAX_REPS;
// at the top limit in the last two workouts: time for the harder version
function mastered(exId){
  const e = exById(exId), h = historyFor(exId);
  return !!e && h.length >= 2 && h.slice(-2).every(x=>maxV(x.it) >= capOf(e));
}
function harderFor(exId, place){
  let e = exById(exId), seen = 0;
  while(e && e.next && seen++ < 5){
    const n = exById(e.next);
    if(n && (!place || allowed(n, place))) return n;
    e = n;
  }
  return null;
}
function bestBefore(exId){ const h = historyFor(exId); return h.length ? Math.max(...h.map(x=>maxV(x.it))) : null; }
function buildItem(exId){
  const sg = suggestion(exId);
  return {ex:exId, sets:Array.from({length:sg.sets}, ()=>({v:sg.v, done:false}))};
}

/* ---------- workout generation ---------- */
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function generate(place){
  const sessions = sortedSessions(), n = sessions.length, lastIdx = {};
  sessions.forEach((s,i)=>s.items.forEach(it=>{ lastIdx[it.ex] = i; }));
  const lastEx = new Set((sessions[n-1]?.items||[]).map(it=>it.ex));
  const count = clampCount(S.settings.count);
  const pool = allExercises().filter(e=>allowed(e, place));

  // jumping or running: inside at most one quiet jump, outside 2 to 4
  const jumps = place === "in" ? (Math.random() < 0.6 ? 1 : 0)
    : 2 + Math.floor(Math.random() * (Math.min(4, count - 3) - 1));
  // always legs, upper body (chair), core and balance; outside the jumps already cover the legs
  const slots = place === "out" && jumps >= 2 ? ["ruke","stomak","ravnoteza"] : ["noge","ruke","stomak","ravnoteza"];
  const extra = shuffle(["noge","ruke","stomak","zivotinje"]);
  for(let k=0; slots.length + jumps < count; k++) slots.push(extra[k % extra.length]);

  const chosen = [], ids = new Set(), fams = new Set();
  function pick(test){
    const tries = [
      e => test(e) && !ids.has(e.id) && !(e.fam && fams.has(e.fam)) && !lastEx.has(e.id),
      e => test(e) && !ids.has(e.id) && !(e.fam && fams.has(e.fam)),
      e => test(e) && !ids.has(e.id),
    ];
    for(const t of tries){
      const c = pool.filter(t);
      if(!c.length) continue;
      const best = c.map(e=>{
        const gap = Math.min(n - (lastIdx[e.id] ?? -30), 30);
        return {e, s: gap * (0.5 + Math.random()) * (e.chair ? 1.3 : 1)};
      }).sort((a,b)=>b.s-a.s)[0].e;
      let use = best;
      if(mastered(best.id)){ const n = harderFor(best.id, place); if(n && !ids.has(n.id) && test(n)) use = n; }
      ids.add(use.id); if(use.fam) fams.add(use.fam); chosen.push(use);
      return use;
    }
    return null;
  }
  const main = [];
  for(const cat of slots){ const e = pick(x=>x.cat===cat && !x.jump); if(e) main.push(e); }
  const jumpList = [];
  for(let k=0; k<jumps; k++){
    const e = place === "out" ? (pick(x=>x.jump && x.place==="out") || pick(x=>x.jump)) : pick(x=>x.jump);
    if(e) jumpList.push(e);
  }
  // top up if a category ran out of exercises
  while(main.length + jumpList.length < count){ const e = pick(x=>!x.jump); if(!e) break; main.push(e); }
  main.sort((a,b)=>ORDER.indexOf(a.cat)-ORDER.indexOf(b.cat));
  // spread the jumps through the workout
  const out = [], gap = (main.length + 1) / (jumpList.length + 1); let ji = 0;
  main.forEach((e,i)=>{ out.push(e); while(ji < jumpList.length && Math.round((ji+1)*gap) - 1 === i) out.push(jumpList[ji++]); });
  while(ji < jumpList.length) out.push(jumpList[ji++]);

  S.plan = {created:new Date().toISOString(), place, items:out.map(e=>buildItem(e.id))};
  persistPlan();
}
// rough length of a workout in minutes
function estMin(plan){
  let sec = plan.warmed ? 0 : 150, sets = 0;
  plan.items.forEach(it=>{
    const e = exById(it.ex) || {type:"reps"}, sides = e.side ? 2 : 1;
    it.sets.forEach(st=>{ const v = +st.v || e.amount || 10;
      sec += isTimed(e) ? v*sides + 4 : (e.unit==="put" ? v*12 : v*3.5*sides); sets++; });
    sec += (it.sets.length-1) * S.settings.restSet;
  });
  sec += Math.max(0, plan.items.length-1) * S.settings.restEx;
  return Math.max(5, Math.round(sec/60/5)*5);
}
const planJumps = () => (S.plan?.items||[]).filter(it=>exById(it.ex)?.jump).length;
function canAdd(e){
  if(!S.plan) return true;
  if(!allowed(e, S.plan.place)) return false;
  if(S.plan.place === "in" && e.jump && planJumps() >= 1) return false;
  return true;
}
function swap(i){
  const cur = S.plan.items[i], e = exById(cur.ex); if(!e) return;
  const inPlan = new Set(S.plan.items.map(x=>x.ex));
  const famOthers = new Set(S.plan.items.filter((x,k)=>k!==i).map(x=>exById(x.ex)?.fam).filter(Boolean));
  const lastEx = new Set((sortedSessions().slice(-1)[0]?.items||[]).map(x=>x.ex));
  const base = allExercises().filter(x=>x.cat===e.cat && x.jump===e.jump && !inPlan.has(x.id) && allowed(x, S.plan.place));
  let c = base.filter(x=>!(x.fam && famOthers.has(x.fam)) && !lastEx.has(x.id));
  if(!c.length) c = base.filter(x=>!(x.fam && famOthers.has(x.fam)));
  if(!c.length) c = base;
  if(!c.length) return toast("Nema druge vežbe iz ove grupe");
  const p = c[Math.floor(Math.random()*c.length)];
  S.plan.items[i] = buildItem(p.id);
  persistPlan(); render();
}

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fmtDate(iso){ return new Date(iso).toLocaleDateString(LOCALE, {weekday:"short", day:"numeric", month:"short"}); }
let toastTimer;
function toast(msg){
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.remove(), 2600);
}
const ICON = {

};

/* ---------- metrics ---------- */
function weekStart(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function weekCounts(n){
  const now = weekStart(new Date()), out = [];
  for(let k=n-1;k>=0;k--){ const a=new Date(now); a.setDate(a.getDate()-7*k); const b=new Date(a); b.setDate(b.getDate()+7);
    out.push(S.sessions.filter(s=>{ const d=new Date(s.date); return d>=a && d<b; }).length); }
  return out;
}
function streak(){
  const w = weekCounts(52); let i = w.length-1, n = 0;
  if(w[i] < 3) i--;               // this week is still in progress
  for(; i>=0 && w[i]>=3; i--) n++;
  return n;
}
function progress(){
  const now = new Date(), mo = new Date(now.getFullYear(), now.getMonth(), 1);
  return {week:weekCounts(1)[0], month:S.sessions.filter(s=>new Date(s.date)>=mo).length, total:S.sessions.length};
}
function arc(cx,cy,r,a0,a1){
  const p = a=>[cx+r*Math.cos((a-90)*Math.PI/180), cy+r*Math.sin((a-90)*Math.PI/180)];
  const [x0,y0]=p(a0), [x1,y1]=p(a1);
  return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
}
function ringSVG(lit){
  let s = ""; const g = 22;
  for(let k=0;k<3;k++){ const a0=k*120-60+g/2, a1=(k+1)*120-60-g/2;
    s += `<path d="${arc(130,130,112,a0,a1)}" class="${k<lit?"seg on":"seg"}"/>`; }
  return `<svg viewBox="0 0 260 260" aria-hidden="true">${s}</svg>`;
}

/* ---------- views ---------- */
const longDate = () => new Date().toLocaleDateString(LOCALE, {weekday:"long", day:"numeric", month:"long"});
function heroBlock(){
  const p = progress(), mName = new Date().toLocaleDateString(LOCALE, {month:"long"});
  const pct = Math.min(100, Math.round(p.month/12*100));
  return `<div class="hero" role="img" aria-label="${p.week} od 3 treninga ove nedelje">${ringSVG(Math.min(3,p.week))}
      <div class="hero-c"><div class="hero-n">${p.week}<span>/3</span></div><div class="hero-l">${p.week>=3?"cilj ispunjen!":"ove nedelje"}</div></div></div>
    <div class="month"><span>${esc(mName)}</span><div class="mbar" role="progressbar" aria-label="Treninzi ovog meseca" aria-valuemin="0" aria-valuemax="12" aria-valuenow="${p.month}"><i style="width:${pct}%" class="${p.month>=12?"met":""}"></i></div><b>${p.month}</b><span>od 12</span></div>`;
}
const safetyBlock = () => `<div class="safety" role="note">${ICON.warn}<span>${esc(SAFETY)}</span></div>`;
function itemState(it){ const d = it.sets.filter(s=>s.done).length; return {d, n:it.sets.length, all:d===it.sets.length}; }
function viewToday(){
  const num = S.sessions.length + 1;
  const head = `<header class="pad"><div class="eyebrow">${esc(longDate())}</div><h1>Trening ${num}</h1></header>`;
  if(!S.plan || !S.plan.items.length){
    const dv = window.Drive && Drive.available ? Drive.state() : null;
    const n = S.sessions.length, needBackup = !(dv && dv.connected) && n >= 3 && (n - (S.settings.backupN||0) >= 8 || !S.settings.backupAt);
    const reconnect = dv && dv.connected && dv.needsReconnect && dv.pending
      ? `<div class="banner"><span>Veza sa Google Drive-om je istekla, pa poslednji treninzi nisu sačuvani na Drive-u.</span><button data-act="drvreconnect">Poveži</button></div>` : "";
    const install = !isStandalone() && !S.settings.installSeen
      ? `<div class="banner"><span>Instaliraj aplikaciju na početni ekran, da radi kao prava aplikacija i čuva treninge.</span><button data-act="installinfo">Kako?</button><button class="link" data-act="installlater" style="background:none;color:var(--mut);padding:0 4px">Kasnije</button></div>` : "";
    const banner = reconnect || install || (needBackup ? `<div class="banner"><span>Sačuvaj rezervnu kopiju treninga, da se ništa ne izgubi.</span><button data-act="backup">Sačuvaj</button></div>` : "");
    return head + heroBlock() + safetyBlock() + banner + `<p class="lead">${S.sessions.length ? "Svaki trening je nov: 6 do 8 vežbi za noge, ruke, stomak i ravnotežu." : "Napravi prvi trening: 6 do 8 vežbi za noge, ruke, stomak i ravnotežu."}</p>
      <div class="dock"><button class="cta" data-act="gen">Napravi trening</button></div>`;
  }
  const items = S.plan.items;
  const anyDone = items.some(it=>it.sets.some(s=>s.done));
  const allDone = items.every(it=>itemState(it).all);
  const rows = items.map((it,i)=>{ const e = exById(it.ex) || {name:"Nepoznata vežba"}; const st = itemState(it);
    const meta = st.all ? `<span class="ok" aria-label="Gotovo">${ICON.check}</span>` : st.d ? `<span class="part">${st.d}/${st.n}</span>` : `<b>${it.sets.length} × ${esc(amountText(e, it.sets[0]?.v))}</b>`;
    return `<button class="row${st.all?" done":""}" data-act="open" data-i="${i}"><span class="n">${i+1}</span>${thumbOf(e)}<span class="nm">${esc(e.name)}<small>${esc(CATS[e.cat]||"")}${e.side?", "+esc(e.side):""}</small></span><span class="m">${meta}</span></button>`; }).join("");
  const cta = allDone ? `<button class="cta" data-act="finish">Završi trening</button>` : `<button class="cta" data-act="start">${anyDone ? "Nastavi trening" : "Počni trening"}</button>`;
  return head + heroBlock() + safetyBlock() + `<section class="list">
      <div class="sec"><span>Danas, ${PLACES[S.plan.place].toLowerCase()} <span class="est">· ≈ ${estMin(S.plan)} min</span></span><span class="lnks"><button class="link" data-act="place">Promeni mesto</button><button class="link" data-act="regen">Promešaj</button></span></div>${rows}
      <div class="list-foot"><button class="link" data-act="add">Dodaj vežbu</button>${anyDone&&!allDone?`<button class="link" data-act="finish">Završi sada</button>`:""}<button class="link danger" data-act="discard">Odbaci</button></div>
    </section><div class="dock">${cta}</div>`;
}
function viewFocus(){
  const items = S.plan.items, i = focus.i, it = items[i];
  const e = exById(it.ex) || {name:"Nepoznata vežba", cat:"", type:"reps", amount:10};
  if(selSet===null || selSet>=it.sets.length){ const k = it.sets.findIndex(s=>!s.done); selSet = k<0 ? it.sets.length-1 : k; }
  const j = selSet, s = it.sets[j], timed = isTimed(e);
  const sg = suggestion(it.ex);
  const last = sg.last ? `Prošli put: <b>${esc(setSummary(sg.last))}</b>` : `Prvi put radiš ovu vežbu`;
  const segs = items.map((x,k)=>`<button class="sg ${itemState(x).all?"d":""} ${k===i?"c":""}" data-act="jump" data-i="${k}" aria-label="Vežba ${k+1}"></button>`).join("");
  const circles = it.sets.map((x,k)=>`<span class="sw"><button class="set ${x.done?"done":""} ${k===j?"cur":""}" data-act="sel" data-j="${k}" aria-label="Serija ${k+1}${x.done?", gotova":""}">${x.done?ICON.check:k+1}</button>${k>=3?`<button class="setx" data-act="delsetj" data-i="${i}" data-j="${k}" aria-label="Obriši seriju ${k+1}">${ICON.x}</button>`:""}</span>`).join("")
    + `<button class="set add" data-act="addset" data-i="${i}" aria-label="Dodaj seriju">+</button>`;
  const allDone = items.every(x=>itemState(x).all);
  let nextI = items.findIndex((x,k)=>k>i && !itemState(x).all); if(nextI<0) nextI = items.findIndex((x,k)=>k!==i && !itemState(x).all);
  const next = nextI>=0 ? exById(items[nextI].ex)?.name : null;
  let cta;
  if(hold) cta = holdHTML();
  else if(rest && !allDone) cta = restHTML();
  else if(allDone) cta = `<button class="cta" data-act="finish">Završi trening</button>`;
  else if(s.done) cta = `<button class="cta ghost" data-act="undo">Poništi seriju ${j+1}</button>`;
  else cta = timed ? `<button class="cta" data-act="hold">Kreni: ${esc(clampV(e, s.v))} s${e.side ? " " + esc(e.side) : ""}</button>` : `<button class="cta" data-act="complete">Serija ${j+1} gotova</button>`;
  const step = timed ? 5 : 1;
  return `<div class="focus" data-swipe data-key="f${i}:${esc(it.ex)}:${howOpen?1:0}">
    <div class="ftop"><button class="iconbtn" data-act="back" aria-label="Nazad na današnji trening">${ICON.x}</button><div class="segs">${segs}</div><span class="cnt">${i+1}/${items.length}</span></div>
    <div class="fmain">
      <div class="fpic">${picOf(e, howOpen)}</div>
      <div class="fside">
        <div class="fbody">
          <div class="grp">${esc(CATS[e.cat]||"")}${e.jump?'<span class="tag j">skok</span>':""}</div>
          <button class="fname" data-act="howtoggle" aria-expanded="${howOpen}">${esc(e.name)}${ICON.info}</button>
          ${howOpen ? `<p class="how">${esc(e.desc || "Nema opisa.")}</p>` : `<div class="hint">Tapni naziv za opis</div>`}
          <div class="num"><div class="val"><input class="big" inputmode="numeric" pattern="[0-9]*" data-f="v" data-i="${i}" data-j="${j}" value="${esc(s.v)}" aria-label="${timed?"Sekundi":"Ponavljanja"}"><div class="u">${esc(unitWord(e, +s.v))}${e.side?" "+esc(e.side):""}</div></div>
            <div class="step"><button data-act="nudge" data-d="-1" aria-label="Manje">−${step}</button><button data-act="nudge" data-d="1" aria-label="Više">+${step}</button></div></div>
          <div class="sets">${circles}</div>
          ${harderBox(it)}
          <div class="last">${last}${sg.up?`<br><span class="up">Probaj danas ${esc(amountLong(e, sg.v))}</span>`:""}</div>
          <div class="tools"><button class="link" data-act="swap" data-i="${i}">Zameni vežbu</button><button class="link" data-act="detail" data-id="${esc(it.ex)}">Istorija</button><button class="link danger" data-act="removefocus" data-i="${i}">Ukloni</button></div>
        </div>
        <div class="fdock">${next&&!allDone?`<div class="next"><span>Sledeća</span><b>${esc(next)}</b></div>`:""}<div id="ctaBox">${cta}</div></div>
      </div>
    </div>
  </div>`;
}
function harderBox(it){
  if(it.sets.some(x=>x.done) || !mastered(it.ex)) return "";
  const n = harderFor(it.ex, S.plan.place); if(!n || S.plan.items.some(x=>x.ex===n.id)) return "";
  return `<div class="harder"><span>Ovo ti je sad lako! Probaj težu verziju: <b>${esc(n.name)}</b></span><button data-act="harder">Probaj</button></div>`;
}
function viewWarm(){

function spark(pts, unit){

  return `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Najbolje po treningu, od ${mn} do ${mx} ${unit}"><polyline fill="none" stroke="var(--neon)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${xy.map(a=>a.join(",")).join(" ")}"/>${xy.map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="3" fill="var(--neon)"/>`).join("")}<text x="${Wd-p}" y="14" text-anchor="end" font-size="12" fill="var(--mut)">${mx} ${unit}</text></svg>`;
}
function render(keepScroll=true){

/* ---------- back button (Android) ----------
   Every open layer (exercise screen, warm-up, celebration, a sheet) gets a history entry,
   so the phone's back button closes that layer instead of leaving the app. */
let hDepth = 0, skipPops = 0;
function layerDepth(){ return ((focus || warm || party) ? 1 : 0) + (sheet ? 1 : 0); }
function syncHistory(){
  const d = layerDepth();
  try{
    while(hDepth < d){ history.pushState({layer:hDepth+1}, ""); hDepth++; }
    if(hDepth > d){ skipPops += hDepth - d; const n = hDepth - d; hDepth = d; history.go(-n); }
  }catch(_){}
}
window.addEventListener("popstate", ()=>{
  if(skipPops > 0){ skipPops--; return; }
  if(hDepth === 0) return;
  hDepth--;
  if(sheet) sheet = null;
  else if(party) party = null;
  else if(warm){ warm = null; }
  else if(focus){ focus = null; }
  render(false); window.scrollTo(0,0);
});

function finish(){
  const items = S.plan.items.map(it=>({ex:it.ex, sets:it.sets.filter(s=>s.done).map(s=>({v:+s.v||0}))})).filter(it=>it.sets.length);
  if(!items.length) return toast("Prvo završi bar jednu seriju");
  const records = items.map(it=>{ const e = exById(it.ex), prev = bestBefore(it.ex), now = maxV(it);
    return prev!==null && now>prev ? {name:e?.name||"", text:amountLong(e, now)} : null; }).filter(Boolean);
  const before = earnedBadges();
  const start = S.plan.started ? new Date(S.plan.started) : null;
  const min = start ? Math.max(1, Math.round((Date.now()-start)/60000)) : null;
  const s = {id:Date.now().toString(36), date:new Date().toISOString(), place:S.plan.place, items};

  render(false); window.scrollTo(0,0); ding(); buzz([120,80,120,80,300]);
}

function trainingStats(){
  const ss = sortedSessions(), weeks = {}, months = {}, best = {}, tried = new Set();
  let records = 0;
  ss.forEach(s=>{
    const d = new Date(s.date), wk = weekStart(d).getTime(), mo = d.getFullYear()*12 + d.getMonth();
    weeks[wk] = (weeks[wk]||0) + 1; months[mo] = (months[mo]||0) + 1;
    s.items.forEach(it=>{ const v = maxV(it); if(best[it.ex]!==undefined && v>best[it.ex]) records++; best[it.ex] = Math.max(best[it.ex]??0, v); if(EXMAP[it.ex]) tried.add(it.ex); });
  });
  // longest run of weeks with 3+ workouts
  let longest = 0, run = 0, prev = null;
  Object.keys(weeks).map(Number).sort((a,b)=>a-b).forEach(w=>{
    if(weeks[w] < 3){ run = 0; prev = w; return; }
    const gap = prev===null ? 1 : Math.round((w-prev)/(7*864e5));
    run = (gap===1 && run>0) ? run+1 : 1; prev = w; longest = Math.max(longest, run);
  });
  return {total:ss.length, bestWeek:Math.max(0,...Object.values(weeks)), bestMonth:Math.max(0,...Object.values(months)), longest, records,
          inside:ss.filter(s=>s.place==="in").length, outside:ss.filter(s=>s.place==="out").length, tried:tried.size};
}

// "Proveri ažuriranja": ask the server for a newer service worker; if there is one, it installs and the page reloads.
// Returns 'updating', 'latest', 'offline' or 'unsupported'.
async function checkForUpdate(){
  if(!("serviceWorker" in navigator)) return "unsupported";
  if(navigator.onLine === false) return "offline";
  const reg = await navigator.serviceWorker.getRegistration();
  if(!reg) return "unsupported";
  try{ await reg.update(); }catch(_){ return "offline"; }
  const w = reg.installing || reg.waiting;
  if(!w) return navigator.serviceWorker.controller ? "latest" : "unsupported";
  updating = true;
  setTimeout(()=>{ if(updating) location.reload(); }, 60000);   // fallback if the switch is slow
  if(w.state === "installed") w.postMessage("SKIP_WAITING");
  w.addEventListener("statechange", ()=>{ if(w.state === "installed") w.postMessage("SKIP_WAITING"); });
  return "updating";
}
async function checkUpdateClick(btn){
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Proveravam…';
  let r = "unsupported";
  try{ r = await checkForUpdate(); }catch(_){}
  if(r === "updating"){ btn.innerHTML = '<span class="spin"></span>Učitavam novu verziju…'; return; }
  btn.disabled = false; btn.textContent = "Proveri ažuriranja";
  toast(r === "latest" ? `Imaš najnoviju verziju (${APP_VERSION}).` : r === "offline" ? "Nema interneta. Pokušaj ponovo kad budeš na mreži." : "Provera nije moguća u ovom pregledaču. Zatvori i ponovo otvori aplikaciju.");
}

// remember deleted workouts/exercises, so a copy from another device doesn't bring them back
function forget(id){ S.deleted = (S.deleted||[]).concat(id).slice(-1000); }
// add workouts and own exercises from another copy (file or Drive); returns how many workouts were added
function mergeData(v){
  const gone = new Set([...(S.deleted||[]), ...(Array.isArray(v.deleted) ? v.deleted : [])]);
  S.deleted = [...gone].slice(-1000);
  S.sessions = S.sessions.filter(x=>!gone.has(x.id));
  S.custom = S.custom.filter(x=>!gone.has(x.id));
  const have = new Set(S.sessions.map(x=>x.id)); let added = 0;
  for(const x of Array.isArray(v.sessions) ? v.sessions : []){
    if(!x || typeof x.id!=="string" || gone.has(x.id) || have.has(x.id) || !x.date || !Array.isArray(x.items)) continue;
    S.sessions.push(x); have.add(x.id); added++;
  }
  for(const c of Array.isArray(v.custom) ? v.custom : []){
    if(!c || typeof c.id!=="string" || gone.has(c.id)) continue;
    const mine = S.custom.find(x=>x.id===c.id);
    if(!mine) S.custom.push(c); else if((c.updated||0) > (mine.updated||0)) Object.assign(mine, c);
  }
  return added;
}

  const data = JSON.stringify(backupData(), null, 1);
  const name = "trening-kopija-" + new Date().toISOString().slice(0,10) + ".json";
  try{
    const file = new File([data], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Rezervna kopija treninga"}); mark(); return; }
  }catch(err){ if(err && err.name==="AbortError") return; }
  const url = URL.createObjectURL(new Blob([data], {type:"application/json"}));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000); mark(); toast("Rezervna kopija je sačuvana");
}
document.getElementById("restore").addEventListener("change", async e=>{
  const f = e.target.files[0]; if(!f) return;
  try{
    const v = JSON.parse(await f.text());
    if(v.app!=="trening-za-decu") throw 0;
    const added = mergeData(v);
    if(v.settings) S.settings = Object.assign(S.settings, v.settings, {count:clampCount(v.settings.count)});
    saveLocal(); driveChanged(); render(); toast(added ? `Vraćeno treninga: ${added}` : "U toj kopiji nema ničeg novog");
  }catch(_){ toast("Taj fajl nije rezervna kopija treninga"); }
  e.target.value = "";
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && sheet){ sheet = null; render(); } });

/* ---------- rest timer, countdown and warm-up ---------- */
const PREP_MS = 3000;
const fmtT = ms => { const s = Math.max(0, Math.ceil(ms/1000)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
const SPEAKER_ON = '<svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>';
const SPEAKER_OFF = '<svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>';
const muteBtn = () => { const m = !!S.settings.mute; return `<button class="link mute" data-act="mute" aria-pressed="${!m}">${m?SPEAKER_OFF:SPEAKER_ON}${m?"Zvuk isključen":"Zvuk uključen"}</button>`; };
function restHTML(){
  if(!rest) return "";
  const nextSet = (selSet ?? 0) + 1, ex = rest.kind === "ex";
  if(rest.over) return `<button class="cta go" data-act="restgo">${ex ? "Kreni sa sledećom vežbom" : `Kreni sa serijom ${nextSet}`}</button>`;
  const left = rest.end - Date.now(), label = ex ? "Odmor, pa sledeća vežba" : `Odmor pre serije ${nextSet}`;
  return `<div class="rest" role="timer" aria-label="${label}">
    <div class="rest-top"><span class="rest-l">${label}</span><span class="rest-t" id="restT">${fmtT(left)}</span></div>
    <div class="rest-line"><i id="restL" style="transform:scaleX(${Math.max(0,left/rest.total).toFixed(3)})"></i></div>
    <div class="rest-b">${muteBtn()}<span class="sp"></span><button class="link" data-act="rest30">+30 s</button><button class="link" data-act="restskip">Preskoči</button></div></div>`;
}
function unlockAudio(){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(_){}
}
// one low, soft ding
function ding(){
  if(S.settings.mute || !actx) return;
  try{
    const t = actx.currentTime, out = actx.createGain(); out.gain.value = .55; out.connect(actx.destination);
    [[392,1,2.2],[784,.28,1.2],[1082,.12,.7]].forEach(([f,v,dur])=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g); g.connect(out); o.start(t); o.stop(t+dur+.05);
    });
  }catch(_){}
}
// short tick for "3, 2, 1"
function beep(freq=660, dur=.13, vol=.35){
  if(S.settings.mute || !actx) return;
  try{
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine"; o.frequency.value = freq; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.005); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+.03);
  }catch(_){}
}
// beep once for each of the last three seconds of a countdown
function countdownBeeps(obj, key, leftMs, freq=660){
  const sec = Math.ceil(leftMs/1000);
  if(sec>=1 && sec<=3){ obj.beeps = obj.beeps || {}; const k = key+":"+sec; if(!obj.beeps[k]){ obj.beeps[k] = 1; beep(freq); } }
}
const buzz = (p=[250,120,250]) => { try{ navigator.vibrate && navigator.vibrate(p); }catch(_){} };
// only one "keep the screen on" request at a time; if the workout ended while it was being granted, let go right away
let wakePending = false;
async function holdWake(){
  if(!("wakeLock" in navigator) || wakeLock || wakePending) return;
  wakePending = true;
  try{
    const l = await navigator.wakeLock.request("screen");
    l.addEventListener?.("release", ()=>{ if(wakeLock === l) wakeLock = null; });
    wakeLock = l;
    if(!(focus || warm || hold || (rest && !rest.over))) releaseWake(true);
  }catch(_){ wakeLock = null; }
  finally{ wakePending = false; }
}
function releaseWake(force){ if(!force && (focus || warm)) return; try{ wakeLock?.release(); }catch(_){} wakeLock = null; }
// the screen stays on for the whole workout (warm-up, exercises, rest, timers), and sleeps normally otherwise
function keepAwake(){ if(focus || warm || hold || (rest && !rest.over)) holdWake(); else if(wakeLock) releaseWake(true); }
function startRest(kind){
  unlockAudio();
  const ms = (kind==="ex" ? S.settings.restEx : S.settings.restSet) * 1000;
  rest = {end:Date.now()+ms, total:ms, over:false, kind};
  holdWake();
}
function restOver(){
  rest.over = true; releaseWake(); ding(); buzz();
  const box = document.getElementById("ctaBox");
  if(focus && box) box.innerHTML = restHTML();
  else toast("Odmor je gotov. Vreme je za sledeću seriju");
}
function completeAt(i, j, carry=true){
  const it = S.plan.items[i]; if(!it || !it.sets[j]) return;
  const cs = it.sets[j]; cs.done = true;
  if(!S.plan.started) S.plan.started = new Date().toISOString();
  if(carry) it.sets.forEach((x,k)=>{ if(k>j && !x.done) x.v = cs.v; });
  const ex = exById(it.ex), prev = bestBefore(it.ex);
  if(!it.rec && prev!==null && +cs.v > prev){ it.rec = true; ding(); toast(`Novi rekord! ${amountLong(ex, cs.v)}`); }
  const exDone = it.sets.every(s=>s.done);
  if(focus && focus.i===i){
    const nx = it.sets.findIndex(s=>!s.done);
    if(nx>=0) selSet = nx;
    else { const k = nextPending(); if(k>=0 && k!==focus.i){ focus.i = k; selSet = null; howOpen = false; if(!it.rec) toast("Sledeća vežba"); } }
  }
  persistPlan();
  if(!S.plan.items.every(x=>itemState(x).all)) startRest(exDone ? "ex" : "set");
}
function holdState(){
  const now = Date.now();
  if(now < hold.start) return {prep:true, n:Math.ceil((hold.start-now)/1000)};
  const el = now - hold.start, sideIdx = Math.min(hold.sides-1, Math.floor(el / hold.side));
  const left = hold.sides>1 ? (sideIdx+1)*hold.side - el : hold.total - el;
  const label = hold.sides>1 ? (sideIdx===0 ? `Prva ${hold.label}` : `Druga ${hold.label}`) : `Drži, serija ${hold.j+1}`;
  return {prep:false, el, sideIdx, left, label};
}
function holdHTML(){
  const h = holdState();
  if(h.prep) return `<div class="prep" role="timer" aria-label="Spremi se"><div><b>Spremi se!</b><br><button class="link danger" data-act="holdcancel">Otkaži</button></div><span class="pn" id="prepN">${h.n}</span></div>`;
  return `<div class="rest hold" role="timer" aria-label="${esc(h.label)}">
    <div class="rest-top"><span class="rest-l" id="holdN">${esc(h.label)}</span><span class="rest-t" id="holdT">${fmtT(h.left)}</span></div>
    <div class="rest-line"><i id="holdL" style="transform:scaleX(${Math.max(0,h.left/hold.side).toFixed(3)})"></i></div>
    <div class="rest-b"><button class="link danger" data-act="holdcancel">Otkaži</button><span class="sp"></span><button class="link" data-act="holdstop">Gotovo ranije</button></div></div>`;
}
function tickHold(){
  if(!hold) return;
  const h = holdState(), box = document.getElementById("ctaBox");
  if(h.prep){
    countdownBeeps(hold, "prep", hold.start - Date.now(), 520);
    const n = document.getElementById("prepN"); if(n) n.textContent = h.n;
    return;
  }
  if(!hold.started){ hold.started = true; beep(880, .25, .45); buzz(120); if(box) box.innerHTML = holdHTML(); }
  if(h.el >= hold.total){
    const x = hold; hold = null; ding(); buzz();
    completeAt(x.i, x.j);
    if(focus) render(false); else toast("Serija je gotova");
    return;
  }
  countdownBeeps(hold, "s"+h.sideIdx, h.left);
  if(hold.sides>1 && h.sideIdx>0 && !hold.switched){ hold.switched = true; ding(); buzz(); toast(hold.label==="strana" ? "Promeni stranu!" : "Promeni nogu!"); }
  const t = document.getElementById("holdT"), l = document.getElementById("holdL"), nm = document.getElementById("holdN");
  if(t) t.textContent = fmtT(h.left);
  if(nm) nm.textContent = h.label;
  if(l) l.style.transform = `scaleX(${(h.left/hold.side).toFixed(3)})`;
}
// ---- warm-up ----
function startWarm(){
  unlockAudio();
  const list = WARMUP[S.plan.place] || WARMUP.in;
  warm = {list, i:0, end:Date.now()+list[0].sec*1000};
  if(!S.plan.started) S.plan.started = new Date().toISOString();
  focus = null; holdWake(); render(false); window.scrollTo(0,0);
}
function warmNext(){
  if(!warm) return;
  warm.i++; warm.beeps = null;
  if(warm.i >= warm.list.length) return warmDone();
  ding(); buzz(150);
  warm.end = Date.now() + warm.list[warm.i].sec*1000;
  render(false);
}
function warmDone(skip){
  warm = null; S.plan.warmed = true; persistPlan(); releaseWake();
  if(!skip){ ding(); buzz(); toast("Zagrejan si! Kreće trening"); }
  const k = S.plan.items.findIndex(x=>!itemState(x).all); openFocus(k<0 ? 0 : k);
}
function tickWarm(){
  if(!warm || document.hidden) return;
  const left = warm.end - Date.now();
  if(left <= 0) return warmNext();
  countdownBeeps(warm, "w"+warm.i, left);
  const t = document.getElementById("warmT"); if(t) t.textContent = fmtT(left);
  const l = document.getElementById("warmL"); if(l) l.style.transform = `scaleX(${Math.max(0,left/(warm.list[warm.i].sec*1000)).toFixed(3)})`;
}
function tickRest(){
  tickHold(); tickWarm();
  if(!rest || rest.over) return ensureTicker();
  const left = rest.end - Date.now();
  if(left<=0) return restOver();
  countdownBeeps(rest, "r", left);
  const t = document.getElementById("restT"), l = document.getElementById("restL");
  if(t) t.textContent = fmtT(left);
  if(l) l.style.transform = `scaleX(${(left/rest.total).toFixed(3)})`;
}
// the 5-times-a-second tick runs only while something is counting down
let ticker = 0;
function ensureTicker(){
  const need = (rest && !rest.over) || hold || warm;
  if(need && !ticker) ticker = setInterval(tickRest, 200);
  else if(!need && ticker){ clearInterval(ticker); ticker = 0; }
}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ tickRest(); keepAwake(); } });

/* ---------- start ---------- */
loadLocal();
const h0 = location.hash.slice(1); if(["danas","vezbe","istorija"].includes(h0)) tab = h0;
render();
reduceMotion.addEventListener?.("change", ()=>render());
// load all still pictures in the background so lists show them right away
setTimeout(()=>{ EX.map(e=>e.id).concat("nova-vezba", ...Object.values(WARMUP).flat().map(m=>m.img)).forEach(sl=>loadIll(`images/${sl}.svg`)); }, 300);
// ask the browser to keep saved workouts permanently (Safari can clear site data that isn't used for a while)
if(S.sessions.length) askPersist();
if("serviceWorker" in navigator){
  const hadSW = !!navigator.serviceWorker.controller;
  // a new version was installed: reload once, but never in the middle of a workout screen
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(updating){ location.reload(); return; }
    if(!hadSW) return;
    const reload = () => location.reload();
    if(!focus && !warm && !hold && !party && !sheet) reload();
    else window.addEventListener("pagehide", reload, {once:true});
  });
  window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
